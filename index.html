<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Generator</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b3257, #2561d2);
            font-family: Arial, sans-serif;
        }


        .navbar {
            background-color: #072e58;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .nav-link:hover {
            opacity: 0.8;
        }


        .main-container {
            display: flex;
            justify-content: center;
            padding: 55px 20px;
        }


        .receipt-card {
            width: 100%;
            max-width: 500px;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }


        .receipt-header {
            background: linear-gradient(135deg, #12569e, #082f72);
            color: rgb(107, 224, 214);
            text-align: center;
            padding: 30px 20px;
        }

        .receipt-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .receipt-header p {
            margin: 5px 0 0;
            font-size: 14px;
        }


        .menu {
            padding: 25px;
        }

        .menu-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }


        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 5px;
            border-bottom: 1px solid #e5e5e5;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-left label {
            cursor: pointer;
        }

        .price {
            color: #1769ff;
            font-weight: bold;
        }


        .btn-order {
            width: 100%;
            border: none;
            padding: 12px;
            margin-top: 20px;
            border-radius: 7px;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, #1769ff, #6918e8);
        }

        .btn-order:hover {
            opacity: 0.9;
        }

        #show {
            padding: 0 25px 25px;
        }

        .receipt-result {
            background-color: #f5f5f5;
            border-radius: 8px;
            padding: 18px;
            margin-top: 5px;
        }

        .receipt-result h4 {
            margin-bottom: 15px;
            text-align: center;
        }

        .total {
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>


<body>

    <nav class="navbar">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Skewer
            </a>

            <div class="d-flex gap-3">

                <a class="nav-link" href="index.html">
                    Receipt Generator
                </a>

                <a class="nav-link" href="sku.html">
                    SKU Generator
                </a>

            </div>

        </div>
    </nav>



    <div class="main-container">

        <div class="receipt-card">


            <div class="receipt-header">

                <h2>OBMC Entrep Fair</h2>

                <p>Cafe</p>

            </div>


            <div class="menu">

                <div class="menu-title">
                    Menu
                </div>


                <div class="item">

                    <div class="item-left">

                        <input
                            type="checkbox"
                            id="item1"
                            value="99"
                        >

                        <label for="item1">
                            Americano
                        </label>

                    </div>

                    <span class="price">
                        ₱99
                    </span>

                </div>



                <div class="item">

                    <div class="item-left">

                        <input
                            type="checkbox"
                            id="item2"
                            value="129"
                        >

                        <label for="item2">
                            Spanish Latte
                        </label>

                    </div>

                    <span class="price">
                        ₱129
                    </span>

                </div>


                <div class="item">

                    <div class="item-left">

                        <input
                            type="checkbox"
                            id="item3"
                            value="139"
                        >

                        <label for="item3">
                            Cold Brew Milk
                        </label>

                    </div>

                    <span class="price">
                        ₱139
                    </span>

                </div>



                <div class="item">

                    <div class="item-left">

                        <input
                            type="checkbox"
                            id="item4"
                            value="159"
                        >

                        <label for="item4">
                            Affogato
                        </label>

                    </div>

                    <span class="price">
                        ₱159
                    </span>

                </div>


                <div class="item">

                    <div class="item-left">

                        <input
                            type="checkbox"
                            id="item5"
                            value="129"
                        >

                        <label for="item5">
                            Caramel Macchiato
                        </label>

                    </div>

                    <span class="price">
                        ₱129
                    </span>

                </div>


  
                <button
                    class="btn-order"
                    py-click="create_order"
                >
                    Create Order
                </button>

            </div>



            <div id="show">

                <div class="text-center text-muted">
                    Your order summary will appear here.
                </div>

            </div>

        </div>

    </div>


    <script type="py" src="./main.py"></script>

</body>

</html>
